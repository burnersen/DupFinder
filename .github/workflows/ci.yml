# DupFinder (https://github.com/burnersen/DupFinder)
# Copyright (C) 2026 burnersen
# SPDX-License-Identifier: GPL-3.0-only
#
# Checks every push and pull request. Nothing is published here.
#
# Linux runs the tests: the detection logic is platform neutral, so it runs
# anywhere, and Linux runners are fast. The Windows code is vetted from
# Linux, then DupFinder is built, tested and started once on a real
# Windows runner, where it is used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The go line in go.mod is the version releases are built with.
          go-version-file: go.mod
          # No go.sum without dependencies: a cache would only warn.
          cache: false

      # gofmt -l only lists offenders and exits 0; turning its output into
      # the verdict is the point of this step.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-clean:"; echo "$unformatted"; exit 1; fi

      - name: go vet (Linux, Windows x64)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      # Built with the toolchain from go.mod (GOTOOLCHAIN=local): a
      # govulncheck built with an older Go cannot read newer sources.
      - name: govulncheck
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: build for the release target
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go test (native Windows)
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -o DupFinder.exe .
      # The exe must start, answer and end with the documented exit code.
      - name: smoke test
        shell: pwsh
        run: |
          ./DupFinder.exe
          if ($LASTEXITCODE -ne 1) { Write-Host "::error::no folder given must end with exit code 1"; exit 1 }
          exit 0
